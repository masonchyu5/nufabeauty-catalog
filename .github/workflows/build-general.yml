name: Build general catalog

# Triggers only on build inputs. The paths deliberately exclude everything this
# workflow commits (general.html, images/general/**), so its own commit cannot
# retrigger it. base.html is included because general.html extends it.
on:
  push:
    branches: [main]
    paths:
      - "source/general/**"
      - templates/general.html
      - templates/_page_general.html
      - templates/base.html
      - scripts/build_general.py
      - requirements-catalog.txt

permissions:
  contents: write

concurrency:
  group: build-general-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-catalog.txt

      - run: pip install -r requirements-catalog.txt

      - run: python scripts/build_general.py

      - name: Commit rebuilt general catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add general.html images/general
          if git diff --cached --quiet; then
            echo "Build outputs unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Rebuild general catalog (auto)"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase
          done
          git push
